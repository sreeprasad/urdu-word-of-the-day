<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urdu word of the day</title>
  <meta name="description" content="One Urdu word a day, with example sentences in Roman Urdu and a chance to practise words from earlier days." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="row masthead">
    <span class="note"></span>
    <div class="text"><span class="title">Urdu word of the day</span><time id="date"></time></div>
  </header>
  <div class="gap"></div>
  <main id="app"><div class="row"><span class="note"></span><p class="text">Opening today's page…</p></div></main>

  <script>
    const app = document.getElementById("app");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const row = (html, cls = "") => `<div class="row ${cls}"><span class="note"></span><div class="text">${html}</div></div>`;
    const rowWithMark = (mark, html) => `<div class="row"><span class="note">${mark}</span><div class="text">${html}</div></div>`;
    const gap = '<div class="gap"></div>';

    // ---- Practice history lives in this browser only. ----
    const STORE_KEY = "urdu-word-of-the-day";
    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
    }
    function saveStore(store) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); return true; } catch { return false; }
    }

    // Small stable hash so the practice word doesn't change when you refresh.
    function hash(str) {
      let h = 2166136261;
      for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }

    // Pick a past word (from days since this browser's first visit) that you've practised least.
    function pickReview(store, today, todayWordId, pastDays) {
      const done = store.practice?.[today];
      if (done) return pastDays.find((d) => d.word.id === done.wordId)?.word || null;
      const counts = {};
      for (const p of Object.values(store.practice || {})) counts[p.wordId] = (counts[p.wordId] || 0) + 1;
      const candidates = pastDays
        .filter((d) => d.date >= store.first && d.date < today && d.word.id !== todayWordId)
        .map((d) => d.word);
      if (!candidates.length) return null;
      candidates.sort((a, b) => (counts[a.id] || 0) - (counts[b.id] || 0) || hash(today + a.id) - hash(today + b.id));
      return candidates[0];
    }

    const examples = (list) => `<ol class="examples">${list.map((s) => `
      <li><p>${esc(s.roman)}</p><p class="en">${esc(s.english)}</p></li>`).join("")}</ol>`;
    const tick = (animate) => `<svg class="tick ${animate ? "draw" : ""}" viewBox="0 0 40 32" aria-label="Done"><path d="M6 17 L15 25 L34 6"/></svg>`;

    function todaySection(word) {
      return `<section id="today">
        ${row(`<h1 class="word">${esc(word.roman)}</h1>`)}
        ${word.urdu ? row(`<p class="urdu" lang="ur">${esc(word.urdu)}</p>`) : ""}
        ${row(`<p class="meaning">${esc(word.english)}</p>`)}
        ${gap}
        ${row(examples(word.sentences))}
        ${row(`<button type="button" id="toggle-en">Hide English</button>`)}
      </section>`;
    }

    function practiceSection(review, practiced, justSaved) {
      if (!review) return "";
      const head = `${gap}${gap}
        ${row(`<h2>Use this word in two sentences of your own</h2>`)}
        ${row(`<p class="word small">${esc(review.roman)}</p>`)}
        ${review.urdu ? row(`<p class="urdu small" lang="ur">${esc(review.urdu)}</p>`) : ""}
        ${row(`<p class="meaning">${esc(review.english)}</p>`)}
        ${gap}`;
      if (practiced) {
        return `<section>${head}
          ${rowWithMark(tick(justSaved), `<p class="mine">${esc(practiced.s1)}</p><p class="mine">${esc(practiced.s2)}</p>`)}
          ${gap}
          ${row(`<h2>How it's used in the examples</h2>`)}
          ${row(examples(review.sentences || []))}
        </section>`;
      }
      return `<section>${head}
        <form id="practice">
          ${row(`<label class="sr-only" for="s1">Sentence 1</label><textarea id="s1" maxlength="500" placeholder="Write in Roman Urdu"></textarea>`)}
          ${row(`<label class="sr-only" for="s2">Sentence 2</label><textarea id="s2" maxlength="500"></textarea>`)}
          ${row(`<button class="save" type="submit">Save my sentences</button>`)}
          ${row(`<p class="error" id="practice-err" role="alert"></p>`)}
        </form>
      </section>`;
    }

    function moreSection(pastCount) {
      return `<section>${gap}${gap}
        ${row(`<h2>Get the word by email each morning</h2>`)}
        <form id="subscribe" novalidate>
          ${row(`<div class="inline-form">
              <label class="sr-only" for="email">Email address</label>
              <input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" />
              <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
              <button class="save" type="submit">Subscribe</button>
            </div>`)}
          ${row(`<p id="subscribe-msg" role="status"></p>`)}
        </form>
        ${pastCount ? `${gap}${row(`<a href="/archive">All past words (${pastCount})</a>`)}` : ""}
      </section>`;
    }

    async function load() {
      try {
        const todayRes = await fetch("/api/today");
        const data = await todayRes.json();
        if (!todayRes.ok) throw new Error(data.error || "Today's word didn't load.");

        const store = loadStore();
        if (!store.first) { store.first = data.date; store.practice = {}; saveStore(store); }

        const archRes = await fetch(`/api/archive?since=${encodeURIComponent(store.first)}`);
        const archive = archRes.ok ? await archRes.json() : { days: [], total: 0 };

        render({ data, store, archive, justSaved: false });
      } catch (e) {
        app.innerHTML = row(`<p class="error">${esc(e.message)} Refresh the page to try again.</p>`);
      }
    }

    function render({ data, store, archive, justSaved }) {
      const d = new Date(data.date + "T12:00:00");
      document.getElementById("date").innerHTML =
        `<span class="weekday">${d.toLocaleDateString("en-GB", { weekday: "long" })} </span>${d.toLocaleDateString("en-GB", { day: "numeric", month: "long" })}`;

      const review = pickReview(store, data.date, data.word.id, archive.days);
      const practiced = store.practice?.[data.date] || null;
      const pastCount = Math.max(0, archive.total - 1);

      app.innerHTML = todaySection(data.word) + practiceSection(review, practiced, justSaved) + moreSection(pastCount);

      const toggle = document.getElementById("toggle-en");
      const today = document.getElementById("today");
      toggle.onclick = () => {
        const hidden = today.classList.toggle("hide-en");
        toggle.textContent = hidden ? "Show English" : "Hide English";
      };

      const practiceForm = document.getElementById("practice");
      if (practiceForm) {
        practiceForm.onsubmit = (ev) => {
          ev.preventDefault();
          const err = document.getElementById("practice-err");
          const s1 = practiceForm.s1.value.trim(), s2 = practiceForm.s2.value.trim();
          if (!s1 || !s2) { err.textContent = "Write both sentences before saving."; return; }
          store.practice = store.practice || {};
          store.practice[data.date] = { wordId: review.id, s1, s2 };
          if (!saveStore(store)) { err.textContent = "Your browser blocked saving. Allow site data for this page and try again."; return; }
          render({ data, store, archive, justSaved: true });
        };
      }

      const subForm = document.getElementById("subscribe");
      subForm.onsubmit = async (ev) => {
        ev.preventDefault();
        const msg = document.getElementById("subscribe-msg");
        const email = subForm.email.value.trim();
        msg.className = "";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.className = "error"; msg.textContent = "Enter a valid email address."; return;
        }
        const btn = subForm.querySelector("button");
        btn.disabled = true;
        try {
          const res = await fetch("/api/subscribe", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email, website: subForm.website.value }),
          });
          const out = await res.json();
          if (!res.ok) throw new Error(out.error || "Subscribing didn't work.");
          msg.className = "muted";
          msg.textContent = out.message;
          subForm.email.value = "";
        } catch (e) {
          msg.className = "error"; msg.textContent = e.message;
        } finally {
          btn.disabled = false;
        }
      };
    }

    load();
  </script>
  <!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "b5a76f517e3d4b2cb45fa59f130ca17e"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
